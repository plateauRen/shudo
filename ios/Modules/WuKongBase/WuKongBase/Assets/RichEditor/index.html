<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Rich Editor</title>
    <style>
      :root,
      html[data-theme="light"] {
        --re-bg: #ffffff;
        --re-fg: #1f2329;
        --re-toolbar-bg: #ffffff;
        --re-btn-bg: #f5f6f7;
        --re-border: rgba(31, 35, 41, 0.12);
        --re-placeholder: #8f959e;
        --re-pre-bg: rgba(0, 0, 0, 0.06);
        --re-th-bg: rgba(0, 0, 0, 0.04);
        --re-accent: #3370ff;
      }
      html[data-theme="dark"] {
        --re-bg: #17181a;
        --re-fg: #c9cdd4;
        --re-toolbar-bg: #1f2329;
        --re-btn-bg: #2b2f36;
        --re-border: rgba(255, 255, 255, 0.12);
        --re-placeholder: #8f959e;
        --re-pre-bg: rgba(255, 255, 255, 0.08);
        --re-th-bg: rgba(255, 255, 255, 0.06);
        --re-accent: #4e83fd;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          --re-bg: #17181a;
          --re-fg: #c9cdd4;
          --re-toolbar-bg: #1f2329;
          --re-btn-bg: #2b2f36;
          --re-border: rgba(255, 255, 255, 0.12);
          --re-placeholder: #8f959e;
          --re-pre-bg: rgba(255, 255, 255, 0.08);
          --re-th-bg: rgba(255, 255, 255, 0.06);
          --re-accent: #4e83fd;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--re-bg);
        color: var(--re-fg);
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: var(--re-bg);
        color: var(--re-fg);
      }
      .wk-rich-toolbar-wrap {
        flex-shrink: 0;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 4px;
        padding: 8px 8px 8px 8px;
        padding-bottom: max(16px, calc(env(safe-area-inset-bottom, 0px) + 10px));
        border-top: 1px solid var(--re-border);
        background: var(--re-toolbar-bg);
        order: 2;
      }
      .wk-rich-toolbar-scroll {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: center;
        gap: 4px;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .wk-rich-toolbar-scroll::-webkit-scrollbar {
        display: none;
      }
      .wk-rich-tb-btn {
        flex: 0 0 auto;
        min-width: 32px;
        height: 32px;
        padding: 0 6px;
        border: 1px solid var(--re-border);
        border-radius: 6px;
        background: var(--re-btn-bg);
        color: var(--re-fg);
        font-weight: 600;
        font-size: 13px;
      }
      .wk-rich-tb-select {
        flex: 0 0 auto;
        height: 32px;
        border-radius: 6px;
        background: var(--re-btn-bg);
        color: var(--re-fg);
        border: 1px solid var(--re-border);
      }
      .wk-rich-color-wrap {
        position: relative;
        flex: 0 0 auto;
      }
      .wk-rich-color-btn {
        font-weight: 800;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .wk-rich-color-palette {
        position: absolute;
        bottom: calc(100% + 6px);
        left: 0;
        z-index: 40;
        display: grid;
        grid-template-columns: repeat(6, 22px);
        gap: 6px;
        padding: 8px;
        border-radius: 10px;
        border: 1px solid var(--re-border);
        background: var(--re-toolbar-bg);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.16);
      }
      .wk-rich-color-palette[hidden] {
        display: none !important;
      }
      .wk-rich-color-swatch {
        width: 22px;
        height: 22px;
        padding: 0;
        border: 1px solid var(--re-border);
        border-radius: 4px;
        cursor: pointer;
      }
      .wk-rich-color-swatch.is-light {
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
      }
      .wk-rich-send {
        flex: 0 0 auto;
        width: 36px;
        height: 36px;
        padding: 0;
        border: none;
        border-radius: 18px;
        background: var(--re-accent);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 1px 3px rgba(51, 112, 255, 0.35);
      }
      .wk-rich-send svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      .wk-rich-send:active {
        opacity: 0.85;
      }
      .wk-rich-editor-main {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        order: 1;
        background: var(--re-bg);
      }
      .wk-rich-editor-body {
        flex: 1;
        overflow: auto;
        padding: 12px;
        background: var(--re-bg);
        color: var(--re-fg);
      }
      .wk-rich-table-bubble {
        position: absolute;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        max-width: calc(100% - 16px);
      }
      .wk-rich-table-bubble[hidden] {
        display: none !important;
      }
      .wk-rich-table-toggle {
        min-width: 40px;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--re-border);
        border-radius: 14px;
        background: var(--re-toolbar-bg);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        font-size: 12px;
        font-weight: 700;
        color: var(--re-accent);
      }
      .wk-rich-table-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 3px;
        padding: 4px 6px;
        border-radius: 8px;
        background: var(--re-toolbar-bg);
        border: 1px solid var(--re-border);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      }
      .wk-rich-table-actions[hidden] {
        display: none !important;
      }
      .wk-rich-table-actions button {
        min-width: 30px;
        height: 28px;
        padding: 0 6px;
        border: 1px solid var(--re-border);
        border-radius: 4px;
        background: var(--re-btn-bg);
        color: var(--re-fg);
        font-size: 12px;
        font-weight: 600;
      }
      .wk-rich-table-actions button.danger {
        color: #de645c;
      }
      .wk-rich-table-actions .wk-rich-tb-sep {
        width: 1px;
        height: 16px;
        background: var(--re-border);
        margin: 0 2px;
      }
      .ProseMirror {
        outline: none;
        min-height: 200px;
        line-height: 1.55;
        font-size: 16px;
        color: var(--re-fg);
      }
      .ProseMirror p.is-editor-empty:first-child::before {
        content: attr(data-placeholder);
        float: left;
        color: var(--re-placeholder);
        pointer-events: none;
        height: 0;
      }
      .ProseMirror pre {
        background: var(--re-pre-bg);
        border-radius: 6px;
        padding: 10px;
        overflow-x: auto;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 13px;
      }
      .ProseMirror table {
        border-collapse: collapse;
        width: 100%;
        margin: 6px 0 10px;
        table-layout: fixed;
      }
      .ProseMirror th,
      .ProseMirror td {
        border: 1px solid var(--re-border);
        padding: 1px 6px;
        min-width: 36px;
        vertical-align: middle;
        line-height: 1.25;
        font-size: 14px;
      }
      .ProseMirror th > p,
      .ProseMirror td > p {
        margin: 0;
        line-height: 1.25;
      }
      .ProseMirror th {
        background: var(--re-th-bg);
      }
      .ProseMirror a {
        color: var(--re-accent);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="./bridge.js"></script>
  </body>
</html>
