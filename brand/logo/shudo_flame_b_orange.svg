<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="v1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#fafaf9"/>

  <text x="400" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#1c1917" text-anchor="middle">叙叨 Shudo</text>
  <text x="400" y="85" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#78716c" text-anchor="middle">火焰旋风 B · 荧光橙配色</text>

  <!-- 主 Logo -->
  <g transform="translate(400, 280)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="80" fill="url(#v1)"/>
    <path d="M0,-65 C36,-50 50,-7 22,36 C7,58 -22,58 -36,36 C-50,14 -36,-14 0,-29 C22,-36 36,-14 22,7 C14,22 -7,22 -14,7 C-22,-7 -7,-22 7,-14" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="0" r="9" fill="#ffffff"/>
    <circle cx="0" cy="0" r="4.5" fill="url(#v1)"/>
  </g>

  <!-- 文字标识 -->
  <g transform="translate(400, 420)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="42" font-weight="800" fill="#1c1917" text-anchor="middle">叙叨</text>
    <text x="0" y="35" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#a8a29e" text-anchor="middle" letter-spacing="4">SHUDO</text>
  </g>

  <!-- App 图标 -->
  <text x="400" y="540" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#78716c" text-anchor="middle">App 图标（1024×1024 模拟）</text>
  <g transform="translate(400, 660)" filter="url(#shadow)">
    <rect x="-60" y="-60" width="120" height="120" rx="28" fill="url(#v1)"/>
    <path d="M0,-45 C25,-35 35,-5 15,25 C5,40 -15,40 -25,25 C-35,10 -25,-10 0,-20 C15,-25 25,-10 15,5 C10,15 -5,15 -10,5 C-15,-5 -5,-15 5,-10" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    <circle cx="0" cy="0" r="3" fill="url(#v1)"/>
  </g>

  <!-- 小图标 -->
  <text x="400" y="800" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#78716c" text-anchor="middle">小图标（64×64 模拟）</text>
  <g transform="translate(400, 860)">
    <rect x="-32" y="-32" width="64" height="64" rx="14" fill="url(#v1)"/>
    <path d="M0,-20 C10,-15 14,-5 6,8 C2,14 -6,14 -10,8 C-14,2 -10,-6 -2,-8 C4,-10 8,-4 4,2 C2,6 -4,6 -6,2 C-8,-2 -4,-6 0,-4" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
</svg>